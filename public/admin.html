<!-- ============================================================
     ADMIN.HTML — Vertex Talent Admin Control Panel
     Password-only login (Tomtom1@)
     ============================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Panel | Vertex Talent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0F2B46; --primary-dark: #081C2F; --primary-soft: #244B6B;
            --secondary: #00A6A6; --secondary-glow: #2DD4BF; --accent: #FF7B54;
            --gold: #FFC857; --dark: #0A1A2B; --gray: #4F6F8F; --white: #FFFFFF;
            --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
            --shadow-soft: 0 20px 35px -12px rgba(0,0,0,0.06);
            --shadow-bold: 0 28px 45px -12px rgba(0,0,0,0.18);
        }
        body { font-family: 'Inter', sans-serif; background: #F0F4F9; color: var(--dark); line-height: 1.5; }

        /* ---- LOGIN SCREEN ---- */
        .admin-login-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .admin-login-box {
            background: white; border-radius: 28px; padding: 44px; max-width: 420px; width: 100%;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.5);
            text-align: center; animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .admin-login-box .lock-icon {
            width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            display: flex; align-items: center; justify-content: center; color: white; font-size: 30px;
            box-shadow: 0 12px 30px rgba(0,166,166,0.35);
        }
        .admin-login-box h1 { font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
        .admin-login-box p { font-size: 14px; color: var(--gray); margin-bottom: 28px; }
        .admin-field { text-align: left; margin-bottom: 16px; position: relative; }
        .admin-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--primary); margin-bottom: 6px; }
        .admin-field input {
            width: 100%; padding: 14px 46px 14px 16px; border: 1.5px solid #e2e8f0; border-radius: 14px;
            font-size: 14.5px; font-family: inherit; background: #FAFCFF; outline: none; transition: 0.2s;
        }
        .admin-field input:focus { border-color: var(--secondary); background: white; box-shadow: 0 0 0 4px rgba(0,166,166,0.1); }
        .toggle-admin-pw {
            position: absolute; right: 14px; top: 34px; background: none; border: none;
            color: #94a3b8; cursor: pointer; font-size: 15px; padding: 4px; transition: 0.2s;
        }
        .toggle-admin-pw:hover { color: var(--secondary); }
        .admin-login-btn {
            width: 100%; padding: 15px; border: none; border-radius: 14px; margin-top: 10px;
            background: linear-gradient(125deg, var(--secondary), var(--primary)); color: white;
            font-size: 15.5px; font-weight: 700; font-family: inherit; cursor: pointer;
            transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 9px;
            box-shadow: 0 12px 25px -6px rgba(0,166,166,0.4);
        }
        .admin-login-btn:hover { transform: translateY(-2px); background: linear-gradient(125deg, var(--accent), var(--primary)); }
        .admin-login-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .login-error {
            background: rgba(239,68,68,0.1); color: var(--danger); padding: 12px;
            border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
            display: none;
        }
        .login-error.show { display: block; }
        .back-home { display: inline-block; margin-top: 20px; font-size: 13px; color: var(--gray); text-decoration: none; }
        .back-home:hover { color: var(--secondary); }

        /* ---- ADMIN DASHBOARD ---- */
        .admin-app { display: none; }
        .admin-app.active { display: block; }

        .admin-sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 250px;
            background: linear-gradient(180deg, var(--primary-dark), var(--primary));
            color: white; padding: 24px 16px; z-index: 100; overflow-y: auto;
        }
        .admin-brand { padding: 0 10px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .admin-brand h2 { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .admin-brand h2 i { color: var(--secondary-glow); }
        .admin-brand span { font-size: 10.5px; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }
        .admin-nav { display: flex; flex-direction: column; gap: 4px; }
        .admin-nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            border-radius: 12px; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500;
            text-decoration: none; cursor: pointer; transition: 0.2s; border: none; background: none;
            font-family: inherit; width: 100%; text-align: left;
        }
        .admin-nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .admin-nav-item.active { background: var(--secondary); color: white; box-shadow: 0 6px 16px rgba(0,166,166,0.3); }
        .admin-nav-item i { width: 18px; text-align: center; font-size: 15px; }
        .admin-nav-item .nav-badge {
            margin-left: auto; background: var(--accent); color: white; font-size: 10.5px;
            font-weight: 700; padding: 2px 8px; border-radius: 50px; min-width: 20px; text-align: center;
        }
        .admin-nav-item .nav-badge.hidden { display: none; }
        .admin-sidebar-footer {
            position: absolute; bottom: 20px; left: 16px; right: 16px;
            padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .admin-sidebar-footer button {
            width: 100%; padding: 11px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.85);
            font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .admin-sidebar-footer button:hover { background: var(--danger); border-color: var(--danger); color: white; }

        .admin-main { margin-left: 250px; padding: 28px 32px; min-height: 100vh; }
        .admin-topbar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
        }
        .admin-topbar h1 { font-size: 26px; font-weight: 800; color: var(--primary); }
        .admin-topbar p { font-size: 13.5px; color: var(--gray); }
        .admin-topbar-actions { display: flex; gap: 10px; align-items: center; }
        .refresh-btn {
            padding: 10px 18px; border-radius: 50px; border: 1.5px solid #e2e8f0;
            background: white; font-family: inherit; font-size: 13px; font-weight: 600;
            color: var(--gray); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 7px;
        }
        .refresh-btn:hover { border-color: var(--secondary); color: var(--secondary); }

        .admin-view { display: none; }
        .admin-view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
        .stat-card {
            background: white; border-radius: 20px; padding: 24px; border: 1.5px solid #e8eef5;
            display: flex; align-items: center; gap: 16px; transition: 0.25s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
        .stat-icon {
            width: 54px; height: 54px; border-radius: 16px; display: flex;
            align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
        }
        .stat-icon.teal { background: rgba(0,166,166,0.12); color: var(--secondary); }
        .stat-icon.coral { background: rgba(255,123,84,0.12); color: var(--accent); }
        .stat-icon.gold { background: rgba(255,200,87,0.2); color: #d97706; }
        .stat-icon.navy { background: rgba(15,43,70,0.1); color: var(--primary); }
        .stat-info .val { font-size: 26px; font-weight: 800; color: var(--primary); line-height: 1.1; }
        .stat-info .lbl { font-size: 12.5px; color: var(--gray); font-weight: 500; }

        .panel-card {
            background: white; border-radius: 20px; border: 1.5px solid #e8eef5;
            padding: 24px; margin-bottom: 24px;
        }
        .panel-card-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
        }
        .panel-card-head h3 { font-size: 17px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 9px; }
        .panel-card-head h3 i { color: var(--secondary); font-size: 15px; }

        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filter-bar input, .filter-bar select {
            padding: 10px 16px; border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-family: inherit; font-size: 13.5px; background: #FAFCFF; outline: none; transition: 0.2s;
        }
        .filter-bar input:focus, .filter-bar select:focus { border-color: var(--secondary); background: white; }
        .filter-bar input { min-width: 240px; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        .data-table th {
            text-align: left; padding: 12px 14px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray);
            border-bottom: 1.5px solid #e8eef5;
        }
        .data-table td { padding: 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .data-table tr:hover td { background: #FAFCFF; }
        .user-cell { display: flex; align-items: center; gap: 12px; }
        .user-cell img, .user-cell .avatar-fallback {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--secondary); flex-shrink: 0;
        }
        .user-cell .avatar-fallback {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
        }
        .user-cell .uinfo strong { display: block; color: var(--primary); font-size: 13.5px; }
        .user-cell .uinfo span { color: var(--gray); font-size: 12px; }

        .status-pill {
            display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px;
            border-radius: 50px; font-size: 11.5px; font-weight: 700;
        }
        .status-pill.active { background: rgba(16,185,129,0.12); color: var(--success); }
        .status-pill.suspended { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status-pill.banned { background: rgba(239,68,68,0.12); color: var(--danger); }
        .status-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .action-btns { display: flex; gap: 6px; }
        .action-btns button {
            width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid #e2e8f0;
            background: white; color: var(--gray); cursor: pointer; transition: 0.2s; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btns button:hover { border-color: var(--secondary); color: var(--secondary); }
        .action-btns button.danger:hover { border-color: var(--danger); color: var(--danger); }

        .msg-list { display: flex; flex-direction: column; gap: 10px; }
        .msg-item {
            padding: 16px 18px; border-radius: 14px; border: 1.5px solid #e8eef5;
            cursor: pointer; transition: 0.2s; background: white;
        }
        .msg-item:hover { border-color: var(--secondary); background: #FAFCFF; }
        .msg-item.unread { border-left: 4px solid var(--accent); background: rgba(255,123,84,0.03); }
        .msg-item .msg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
        .msg-item .msg-from { font-weight: 700; color: var(--primary); font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .msg-item .msg-time { font-size: 11.5px; color: var(--gray); }
        .msg-item .msg-subject { font-size: 13.5px; color: var(--gray); margin-bottom: 4px; }
        .msg-item .msg-preview { font-size: 13px; color: var(--gray); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .modal-overlay {
            position: fixed; inset: 0; z-index: 10002; background: rgba(10,26,43,0.7);
            backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white; border-radius: 24px; padding: 32px; max-width: 560px; width: 100%;
            max-height: 90vh; overflow-y: auto; animation: modalIn 0.3s ease; position: relative;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-box.wide { max-width: 720px; }
        .modal-close {
            position: absolute; top: 18px; right: 18px; width: 34px; height: 34px;
            border-radius: 50%; border: none; background: #f1f5f9; color: var(--gray);
            font-size: 15px; cursor: pointer; transition: 0.2s;
        }
        .modal-close:hover { background: var(--danger); color: white; }
        .modal-box h2 { font-size: 21px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
        .modal-box .modal-sub { font-size: 13px; color: var(--gray); margin-bottom: 22px; }
        .modal-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .modal-form .form-row.full { grid-template-columns: 1fr; }
        .modal-form label { display: block; font-size: 12px; font-weight: 600; color: var(--primary); margin-bottom: 5px; }
        .modal-form input, .modal-form select, .modal-form textarea {
            width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
            font-family: inherit; font-size: 13.5px; background: #FAFCFF; outline: none; transition: 0.2s;
        }
        .modal-form input:focus, .modal-form select:focus, .modal-form textarea:focus {
            border-color: var(--secondary); background: white;
        }
        .modal-form textarea { resize: vertical; min-height: 110px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }
        .modal-actions button {
            padding: 11px 24px; border-radius: 10px; font-family: inherit; font-size: 13.5px;
            font-weight: 600; cursor: pointer; transition: 0.2s; border: none;
        }
        .btn-cancel { background: #f1f5f9; color: var(--gray); }
        .btn-cancel:hover { background: #e2e8f0; }
        .btn-save { background: var(--secondary); color: white; }
        .btn-save:hover { background: var(--secondary-glow); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; }

        .thread { display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; padding: 8px 4px; }
        .thread-msg { padding: 12px 16px; border-radius: 14px; font-size: 13.5px; max-width: 85%; line-height: 1.5; }
        .thread-msg.from-user { background: #F1F5F9; align-self: flex-start; border-bottom-left-radius: 4px; }
        .thread-msg.from-admin { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .thread-msg .meta { font-size: 10.5px; opacity: 0.7; margin-top: 4px; }

        .empty-state { text-align: center; padding: 50px 24px; color: var(--gray); }
        .empty-state i { font-size: 44px; color: #cbd5e1; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .toast {
            position: fixed; top: 24px; right: 24px; z-index: 10001; padding: 14px 22px;
            border-radius: 14px; background: white; box-shadow: var(--shadow-bold);
            display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600;
            transform: translateX(400px); transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-left: 4px solid var(--success);
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--danger); }
        .toast i { font-size: 18px; }
        .toast.success i { color: var(--success); }
        .toast.error i { color: var(--danger); }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); transition: 0.3s; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .data-table { font-size: 12px; }
            .data-table th, .data-table td { padding: 10px 8px; }
            .modal-form .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- ============ LOGIN SCREEN (password only) ============ -->
<div class="admin-login-screen" id="loginScreen">
    <div class="admin-login-box">
        <div class="lock-icon"><i class="fas fa-shield-halved"></i></div>
        <h1>Admin Portal</h1>
        <p>Enter the admin password to continue</p>

        <div class="login-error" id="loginError"><i class="fas fa-exclamation-circle"></i> <span id="loginErrorText"></span></div>

        <form id="adminLoginForm">
            <div class="admin-field">
                <label>Admin Password</label>
                <input type="password" id="adminPass" placeholder="Enter admin password" autocomplete="current-password" required>
                <button type="button" class="toggle-admin-pw" id="toggleAdminPw" aria-label="Show password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button type="submit" class="admin-login-btn" id="adminLoginBtn">
                <i class="fas fa-arrow-right-to-bracket"></i> <span>Sign In</span>
            </button>
        </form>

        <a href="/dashboard" class="back-home"><i class="fas fa-arrow-left"></i> Back to site</a>
    </div>
</div>

<!-- ============ ADMIN APP ============ -->
<div class="admin-app" id="adminApp">

    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-brand">
            <h2><i class="fas fa-bolt"></i> Vertex Admin</h2>
            <span>CONTROL PANEL</span>
        </div>
        <nav class="admin-nav">
            <button class="admin-nav-item active" data-view="overview"><i class="fas fa-gauge-high"></i> Overview</button>
            <button class="admin-nav-item" data-view="users"><i class="fas fa-users"></i> Users <span class="nav-badge" id="usersBadge">0</span></button>
            <button class="admin-nav-item" data-view="messages"><i class="fas fa-envelope"></i> Messages <span class="nav-badge hidden" id="msgBadge">0</span></button>
            <button class="admin-nav-item" data-view="broadcast"><i class="fas fa-bullhorn"></i> Broadcast</button>
            <button class="admin-nav-item" data-view="jobs"><i class="fas fa-briefcase"></i> Jobs API</button>
        </nav>
        <div class="admin-sidebar-footer">
            <button onclick="adminLogout()"><i class="fas fa-arrow-right-from-bracket"></i> Logout</button>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-topbar">
            <div>
                <h1 id="viewTitle">Overview</h1>
                <p id="viewSubtitle">Welcome back, Admin — here's your platform snapshot.</p>
            </div>
            <div class="admin-topbar-actions">
                <button class="refresh-btn" onclick="refreshAll()"><i class="fas fa-rotate"></i> Refresh</button>
            </div>
        </div>

        <div class="admin-view active" id="view-overview">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon teal"><i class="fas fa-users"></i></div>
                    <div class="stat-info"><div class="val" id="statTotalUsers">—</div><div class="lbl">Total Users</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon coral"><i class="fas fa-user-check"></i></div>
                    <div class="stat-info"><div class="val" id="statActiveUsers">—</div><div class="lbl">Active Users</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon gold"><i class="fas fa-envelope"></i></div>
                    <div class="stat-info"><div class="val" id="statUnreadMsgs">—</div><div class="lbl">Unread Messages</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon navy"><i class="fas fa-user-plus"></i></div>
                    <div class="stat-info"><div class="val" id="statNewToday">—</div><div class="lbl">New Today</div></div>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-head">
                    <h3><i class="fas fa-chart-pie"></i> Users by Job Type</h3>
                </div>
                <div id="jobTypeBreakdown"><div class="empty-state"><i class="fas fa-chart-pie"></i><p>Loading…</p></div></div>
            </div>

            <div class="panel-card">
                <div class="panel-card-head">
                    <h3><i class="fas fa-clock-rotate-left"></i> Recent Users</h3>
                    <button class="refresh-btn" onclick="switchView('users')">View all</button>
                </div>
                <div id="recentUsersTable"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div></div>
            </div>
        </div>

        <div class="admin-view" id="view-users">
            <div class="panel-card">
                <div class="panel-card-head">
                    <h3><i class="fas fa-users"></i> All Users</h3>
                    <div class="filter-bar">
                        <input type="text" id="userSearch" placeholder="Search name, email, phone…" oninput="debounceUserSearch()">
                        <select id="userStatusFilter" onchange="loadUsers()">
                            <option value="">All statuses</option>
                            <option value="active">Active</option>
                            <option value="suspended">Suspended</option>
                            <option value="banned">Banned</option>
